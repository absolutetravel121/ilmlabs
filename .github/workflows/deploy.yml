
name: Deploy ILM Labs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH Key
        env:
          SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          printf '%s' "$SSH_KEY_B64" | base64 -d > "$RUNNER_TEMP/ilmlabs_deploy"
          chmod 600 "$RUNNER_TEMP/ilmlabs_deploy"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ runner.temp }}/ilmlabs_deploy
          script: |
            cd /var/www/ilmlabs
            git pull origin main
            npm install
            npm run build
            pm2 restart ilmlabs
